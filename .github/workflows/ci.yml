name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read          # GITHUB_TOKEN en lecture seule

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Tests + quality gate de couverture (80 %)
        run: pytest --cov=app --cov-report=xml --cov-fail-under=80

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # tout l'historique, pas seulement le dernier commit
      - name: Gitleaks sur tout l'historique
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . -v
